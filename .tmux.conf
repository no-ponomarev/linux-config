# ~/.tmux.conf

# ─── Prefix: Ctrl-a ──────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── Terminal & colours ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB' # 24-bit colour (Windows Terminal)
set -g focus-events on
set -sg escape-time 10       # no Esc delay in (n)vim
set -g set-titles on         # pass the pane title (user@host: dir) to the terminal tab
set -g set-titles-string '#T'
set -g set-clipboard on     # apps (e.g. nvim over ssh) may set the clipboard via OSC 52

# ─── General ─────────────────────────────────────────────────────────────────
set -g mouse on              # clickable windows, panes, resizable panes
set -g history-limit 50000   # scrollback lines
set -g display-time 2000     # messages stay 2s
set -g renumber-windows on   # no gaps after closing a window

# ─── Windows & panes: open in the current directory ──────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ─── Vi mode ─────────────────────────────────────────────────────────────────
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection     # v: start selection
bind -T copy-mode-vi C-v send -X rectangle-toggle  # Ctrl-v: block selection
# y (copy to Windows clipboard) is provided by tmux-yank

# ─── Theme (rounded pills, Nerd Font icons; matches the bash prompt colours) ─
# Palette: bg 235 · muted 238/244 · text 250 · blue 39/75 · green 114 · yellow 179 · pink 213
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=colour250,bg=colour235'

# Left: session pill — turns yellow while the prefix (C-a) is pressed
set -g status-left-length 40
set -g status-left '#[fg=#{?client_prefix,colour179,colour39},bg=colour235]#[fg=colour235,bg=#{?client_prefix,colour179,colour39},bold] #S#[fg=#{?client_prefix,colour179,colour39},bg=colour235,nobold]  '

# Windows: plain for inactive, a pill for the current one
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=colour244] #I #[fg=colour250]#W#{?window_zoomed_flag, ,}#[fg=colour179]#{?window_activity_flag, ●,} '
setw -g window-status-current-format '#[fg=colour75,bg=colour235]#[fg=colour235,bg=colour75,bold]#I #[fg=colour75,bg=colour237]#[fg=colour255,bg=colour237] #W#{?window_zoomed_flag, ,}#[fg=colour237,bg=colour235]'
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'none'
setw -g window-status-current-style 'none'   # tmux 3.8 underlines the current window by default

# SSH-aware: while a pane runs ssh, show the remote host/dir taken from the pane
# title, which the (pushed) bash prompt sets to "user@host: dir"
set -g @ssh   '#{==:#{pane_current_command},ssh}'
set -g @rhost '#{s/^[^@]*@([-._a-zA-Z0-9]*).*/\1/:pane_title}'
set -g @rdir  '#{?#{m:*: /,#{pane_title}},/,#{s/^.*[^-._a-zA-Z0-9~+]([-._a-zA-Z0-9~+]+)$/\1/:pane_title}}'
# The title is only "remote" once the remote prompt has set it; until then (or on
# hosts without the pushed .bashrc) it still names this laptop -> show "ssh".
set -g @remote '#{&&:#{E:@ssh},#{!=:#{E:@rhost},#{host_short}}}'
set -g @shost '#{?#{E:@remote},#{E:@rhost},ssh}'
setw -g automatic-rename-format '#{?#{E:@ssh},#{E:@shost},#{pane_current_command}}'

# Right: current dir · host (yellow + globe when remote) · time
set -g status-right-length 100
set -g status-right '#[fg=colour238,bg=colour235]#[fg=colour250,bg=colour238] #{?#{E:@ssh},#{?#{E:@remote},#{E:@rdir},…},#{b:pane_current_path}}#[fg=colour238,bg=colour235] #[fg=#{?#{E:@ssh},colour179,colour114},bg=colour235]#[fg=colour235,bg=#{?#{E:@ssh},colour179,colour114},bold]#{?#{E:@ssh},,󰒋} #{?#{E:@ssh},#{E:@shost},#H}#[fg=#{?#{E:@ssh},colour179,colour114},bg=colour235,nobold] #[fg=colour213,bg=colour235]#[fg=colour235,bg=colour213,bold] %H:%M#[fg=colour213,bg=colour235,nobold]'

# Panes
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'
set -g display-panes-colour colour240
set -g display-panes-active-colour colour39

# Messages, copy mode, menus & popups
set -g message-style 'fg=colour235,bg=colour179,bold'
set -g message-command-style 'fg=colour179,bg=colour235'
setw -g mode-style 'fg=colour235,bg=colour75'
setw -g clock-mode-colour colour39
set -g menu-style 'fg=colour250,bg=colour235'
set -g menu-selected-style 'fg=colour235,bg=colour75,bold'
set -g menu-border-style 'fg=colour39'
set -g menu-border-lines rounded
set -g popup-border-style 'fg=colour39'
set -g popup-border-lines rounded

# ─── Plugins (tpm) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
